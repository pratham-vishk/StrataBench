name: vm-app-kafka
version: "1.0"
layer: vm-application
engine: sbk
description: "Kafka producer perf on VM — run with agent on guest (--clients vm:7777)"
load: heavy

validation:
  require_direct_io: false
  min_runtime_sec: 300
  min_ramp_sec: 0
  require_percentiles: [50, 99]

params:
  driver: kafka
  threads: 8
  duration_sec: 300
  record_size_bytes: 1024

metrics:
  - ops_per_sec
  - throughput_mbps
  - latency_p99
