name: s3-get-throughput
version: "1.0"
layer: object
engine: warp
description: "S3 GET throughput — requires pre-populated objects via Warp"
load: medium

validation:
  require_direct_io: false
  min_runtime_sec: 300
  min_ramp_sec: 30
  require_percentiles: [50, 95, 99]

params:
  operation: get
  object_size: 4MiB
  concurrent: 64
  duration_sec: 300
  bucket: stratabench-test

metrics:
  - ops_per_sec
  - throughput_mbps
  - latency_p50
  - latency_p99
