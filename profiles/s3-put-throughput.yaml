name: s3-put-throughput
version: "1.0"
layer: object
engine: stratabench
description: "S3 PUT throughput test — HTTP, single or multi-threaded"
load: medium

validation:
  require_direct_io: false
  min_runtime_sec: 300
  min_ramp_sec: 30
  require_percentiles: [50, 95, 99]

params:
  operation: put
  object_size: 4MiB
  concurrent: 32
  duration_sec: 300
  bucket: stratabench-test
  prefix: put-bench/

metrics:
  - ops_per_sec
  - throughput_mbps
  - latency_p50
  - latency_p99
