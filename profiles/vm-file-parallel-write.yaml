name: vm-file-parallel-write
version: "1.0"
layer: vm-file
engine: elbencho
description: "Parallel file write on guest-mounted filesystem via SSH — virtual file"
load: heavy

validation:
  require_direct_io: false
  min_runtime_sec: 300
  min_ramp_sec: 0
  require_percentiles: [50, 99]

params:
  pattern: randwrite
  block_size: 1m
  threads: 16
  duration_sec: 300
  rand: true
  guest_mount: /mnt/data

metrics:
  - iops
  - throughput_mbps
  - latency_p99
