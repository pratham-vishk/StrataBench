name: vm-disk-sequential
version: "1.0"
layer: vm-block
engine: fio
description: "Sequential read inside VM guest via SSH — virtual block"
load: light

validation:
  require_direct_io: true
  min_runtime_sec: 300
  min_ramp_sec: 30
  require_percentiles: [50, 95, 99]
  dataset_vs_cache: gt

params:
  ioengine: libaio
  direct: 1
  rw: read
  bs: 1m
  iodepth: 1
  numjobs: 1
  size: 10g
  ramp_time: 30
  runtime: 300
  percentile_list: "50:95:99"
  guest_device: /dev/vdb

metrics:
  - throughput_mbps
  - latency_p50
  - latency_p99
