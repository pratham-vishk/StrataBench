name: app-kafka-producer
version: "1.0"
layer: application
engine: sbk
description: "Kafka producer throughput — SBK-style application storage workload"
load: heavy

validation:
  require_direct_io: false
  min_runtime_sec: 300
  min_ramp_sec: 30
  require_percentiles: [50, 99]

params:
  driver: kafka
  operation: produce
  record_size: 4KiB
  partitions: 12
  duration_sec: 300
  ramp_time_sec: 30
  brokers: "localhost:9092"
  topic: stratabench-test

metrics:
  - ops_per_sec
  - throughput_mbps
  - latency_p99
