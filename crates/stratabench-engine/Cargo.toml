[package]
name = "stratabench-engine"
version = "0.2.0"
edition = "2021"
description = "Native StrataBench I/O engine (Rust)"

[[bin]]
name = "stratabench-engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rand = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.6"
