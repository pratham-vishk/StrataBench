[package]
name = "stratabench-engine"
version = "0.1.0"
edition = "2021"
description = "Native StrataBench I/O engine (Rust scaffold)"

[[bin]]
name = "stratabench-engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
