apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: benchmarks.stratabench.io
spec:
  group: stratabench.io
  names:
    kind: Benchmark
    listKind: BenchmarkList
    plural: benchmarks
    singular: benchmark
    shortNames:
      - sb
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [target]
              properties:
                profile:
                  type: string
                  description: StrataBench workload profile name
                target:
                  type: string
                  description: Single block device, path, DSN, or S3 endpoint
                topology:
                  type: string
                  enum: [auto, single, pool, sweep, shard, matrix]
                  description: Client/server assignment topology
                targets:
                  type: array
                  items:
                    type: string
                  description: Multiple server targets (multi-server topologies)
                clients:
                  type: array
                  items:
                    type: string
                  description: Remote agent URLs host:7777
                mock:
                  type: boolean
                skipValidate:
                  type: boolean
                checkBaseline:
                  type: boolean
                intent:
                  type: string
                  description: Natural language intent (use agent mode)
                useOllama:
                  type: boolean
            status:
              type: object
              properties:
                runId:
                  type: string
                phase:
                  type: string
                message:
                  type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Profile
          type: string
          jsonPath: .spec.profile
        - name: Target
          type: string
          jsonPath: .spec.target
        - name: Phase
          type: string
          jsonPath: .status.phase
