apiVersion: v1
kind: ServiceAccount
metadata:
  name: stratabench-operator
  namespace: stratabench
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stratabench-operator
  namespace: stratabench
rules:
  - apiGroups: ["stratabench.io"]
    resources: ["benchmarks"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["stratabench.io"]
    resources: ["benchmarks/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stratabench-operator
  namespace: stratabench
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: stratabench-operator
subjects:
  - kind: ServiceAccount
    name: stratabench-operator
    namespace: stratabench
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stratabench-operator
  namespace: stratabench
  labels:
    app: stratabench-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stratabench-operator
  template:
    metadata:
      labels:
        app: stratabench-operator
    spec:
      serviceAccountName: stratabench-operator
      containers:
        - name: operator
          image: ghcr.io/pratham-vishk/stratabench:latest
          command: ["/usr/local/bin/stratabench-operator"]
          env:
            - name: STRATABENCH_NAMESPACE
              value: stratabench
            - name: STRATABENCH_ROOT
              value: /etc/stratabench
            - name: STRATABENCH_OPERATOR_INTERVAL
              value: "30s"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: stratabench-data
